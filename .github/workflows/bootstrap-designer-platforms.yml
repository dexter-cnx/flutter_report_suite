name: Bootstrap Designer Platforms

on:
  push:
    branches: [agent/refactor-report-suite]
    paths:
      - '.github/workflows/bootstrap-designer-platforms.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.32.7'

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-report-suite

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        working-directory: apps/designer
        run: |
          flutter create \
            --project-name report_designer \
            --org com.dextercnx \
            --platforms=android,ios,web,macos,windows,linux \
            .

      - name: Restore application-owned files
        run: |
          git checkout -- apps/designer/lib apps/designer/pubspec.yaml apps/designer/assets

      - name: Commit generated platform files
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No platform changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/designer/android apps/designer/ios apps/designer/web apps/designer/macos apps/designer/windows apps/designer/linux apps/designer/.metadata
          git commit -m "chore: add Flutter platform scaffolding"
          git push origin HEAD:agent/refactor-report-suite
