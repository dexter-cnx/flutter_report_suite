name: Deploy Designer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/designer/**'
      - 'packages/report_engine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        working-directory: apps/designer
        run: flutter pub get
      - name: Build Designer Web
        working-directory: apps/designer
        run: flutter build web --release --base-href /flutter_report_suite/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/designer/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
