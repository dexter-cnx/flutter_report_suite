name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.7'

jobs:
  report-engine-quality:
    name: report_engine • format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/report_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          dart format lib test
          changed="$(git diff --name-only -- lib test)"
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              payload="$(base64 -w0 "$file")"
              echo "::error title=FORMATTED_FILE::$file::$payload"
            done <<< "$changed"
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage --reporter expanded

  report-engine-sunmi-quality:
    name: report_engine_sunmi • format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/report_engine_sunmi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          dart format lib test
          changed="$(git diff --name-only -- lib test)"
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              payload="$(base64 -w0 "$file")"
              echo "::error title=FORMATTED_FILE::$file::$payload"
            done <<< "$changed"
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --reporter expanded

  designer-quality:
    name: designer • format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage --reporter expanded

  example-quality:
    name: report_engine example • format + analyze + test + apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/report_engine/example
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Build Android APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/example-apk.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            payload="$(tail -c 12000 /tmp/example-apk.log | base64 -w0)"
            echo "::error title=EXAMPLE_APK_LOG::$payload"
            exit "$status"
          fi

  web-build:
    name: build • web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release

  android-build:
    name: build • android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --debug

  linux-build:
    name: build • linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release

  windows-build:
    name: build • windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release

  apple-builds:
    name: build • macOS + iOS simulator
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug
