name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.7'

jobs:
  report-engine-quality:
    name: report_engine • format + analyze + test + publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/report_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        id: format
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Upload formatted engine files
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-report-engine
          path: |
            packages/report_engine/lib
            packages/report_engine/test
          if-no-files-found: error
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage --reporter expanded
      - name: Verify pub.dev package
        run: flutter pub publish --dry-run

  report-engine-sunmi-quality:
    name: report_engine_sunmi • format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/report_engine_sunmi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        id: format
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Upload formatted Sunmi files
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-report-engine-sunmi
          path: |
            packages/report_engine_sunmi/lib
            packages/report_engine_sunmi/test
          if-no-files-found: error
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --reporter expanded

  designer-quality:
    name: designer • format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage --reporter expanded

  example-quality:
    name: report_engine example • format + analyze + test + apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/report_engine/example
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Build Android APK
        id: example_apk
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/example-apk.log
      - name: Upload example APK failure log
        if: failure() && steps.example_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: example-apk-build-log
          path: /tmp/example-apk.log
          if-no-files-found: error

  web-build:
    name: build • web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release

  android-build:
    name: build • android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --debug

  linux-build:
    name: build • linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release

  windows-build:
    name: build • windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release

  apple-builds:
    name: build • macOS + iOS simulator
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/designer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug
