
name: flutter_offline_report
description: Production offline report engine for Flutter - Thermal 58/80mm, A4, PDF. Thai font support. No backend needed.
version: 1.0.0
homepage: https://github.com/dexter-cnx/flutter_offline_report
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.1
  printing: ^5.12.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  barcode_widget: ^2.0.4
  esc_pos_utils_plus: ^1.1.0
  flutter_blue_plus: ^1.31.15
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/templates/
