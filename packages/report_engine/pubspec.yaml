name: report_engine
description: Offline-first Flutter report engine for PDF, A4, thermal, and ESC/POS output.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.1
  printing: ^5.12.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  barcode_widget: ^2.0.4
  esc_pos_utils_plus: ^2.0.4
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/templates/
    - assets/fonts/
