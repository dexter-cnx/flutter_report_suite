name: report_designer
description: Visual report designer for Web, desktop, and mobile.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  report_engine:
    path: ../../packages/report_engine
  printing: ^5.12.0
  uuid: ^4.4.0
  file_picker: ^8.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
